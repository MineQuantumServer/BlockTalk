plugins { id 'java-library' }
group = 'dev.blocktalk'
version = rootProject.version
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
dependencies {
    implementation project(':third_party:ts3j')
    implementation 'dnsjava:dnsjava:3.6.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation project(':third_party:opus')
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); exclude '**/Native*Test.class','**/Hardware*Test.class' }
tasks.register('nativeTest', Test) { useJUnitPlatform(); include '**/Native*Test.class'; testClassesDirs = sourceSets.test.output.classesDirs; classpath = sourceSets.test.runtimeClasspath }
tasks.register('hardwareTest', Test) { useJUnitPlatform(); include '**/Hardware*Test.class'; testClassesDirs = sourceSets.test.output.classesDirs; classpath = sourceSets.test.runtimeClasspath }
configurations { integrationLogging }
dependencies { integrationLogging 'org.slf4j:slf4j-nop:2.0.9' }
tasks.register('integration', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath + configurations.integrationLogging
    mainClass = 'dev.blocktalk.integration.IntegrationMain'
    standardInput = System.in
    if (project.hasProperty('probeArgs')) args project.property('probeArgs').split(' ')
}
tasks.register('nativeSmoke', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath + configurations.integrationLogging
    mainClass = 'dev.blocktalk.integration.IntegrationMain'
    args '--native-smoke'
}
