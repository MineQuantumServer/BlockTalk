name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build and hardware-independent tests
        shell: bash
        run: bash gradlew clean test build --console=plain
      - name: Translation key check
        shell: bash
        run: python tools/check_localization.py
      - name: Windows native loading and codec tests
        if: runner.os == 'Windows'
        shell: bash
        run: bash gradlew nativeSmoke :core:nativeTest --console=plain
      - name: Hardware test (explicitly skipped without hardware opt-in)
        shell: bash
        run: bash gradlew :core:hardwareTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blocktalk-${{ runner.os }}
          path: |
            build/libs/*.jar
            core/build/reports/tests/
            third_party/ts3j/build/reports/tests/
